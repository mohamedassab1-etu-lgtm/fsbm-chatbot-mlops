version: '3.8'

services:
  db:
    image: mariadb:lts
    container_name: fsbm-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fsbm_assistant
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  ollama:
    image: ollama/ollama:latest
    container_name: fsbm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: fsbm-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "echo 'Waiting for Ollama to boot...' &&
             sleep 10 &&
             echo 'Pulling Qwen2.5:3b...' &&
             ollama pull qwen2.5:3b &&
             echo 'Model pulled successfully!'"

  dagster:
    build:
      context: ./dataops
      dockerfile: Dockerfile
    container_name: fsbm-dagster
    ports:
      - "3001:3000"
    volumes:
      # Mount the data folder so generated DuckDB files persist and can be shared
      - shared_pipeline_data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: ./llm-engine
    container_name: fsbm-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - HF_HOME=/root/.cache/huggingface
      - DUCKDB_PATH=/app/data/duckdb/fsbm.duckdb
      - VECTORSTORE_PATH=/app/vectorstore
    depends_on:
      - db
      - ollama
      - dagster
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - shared_pipeline_data:/app/data
      - vectorstore_cache:/app/vectorstore

  frontend:
    build:
      context: ./website
    container_name: fsbm-frontend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/fsbm_assistant
      - BACKEND_URL=http://backend:8000
    env_file:
      - website/.env.local
    depends_on:
      - db
      - backend

volumes:
  mariadb_data:
  ollama_models:
  huggingface_cache:
  shared_pipeline_data:
  vectorstore_cache: