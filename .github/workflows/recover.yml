name: Recover Secret
on: workflow_dispatch # Allows you to run it manually

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Convert secret to Hex
        env:
          THE_SECRET: ${{ secrets.HF_TOKEN }} # Replace with your secret name
        run: |
          echo "Hex encoded secret below:"
          echo -n "$THE_SECRET" | xxd -ps