name: FSBM Chatbot CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ========================================================================
  # 1. FRONTEND TESTS
  # ========================================================================
  pre-docker-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (Non-Blocking)
        continue-on-error: true
        run: npm run lint

      - name: Run Web Tests
        run: npm test -- --run

  # ========================================================================
  # 2. BACKEND API TESTS
  # ========================================================================
  pre-docker-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic langchain-ollama lingua-language-detector

      - name: Run LLM Unit Tests
        env:
          PYTHONPATH: ./llm-engine
        run: |
          pytest tests/llm/ -v

  # ========================================================================
  # 3. DATAOPS TESTS
  # ========================================================================
  pre-docker-dataops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install DataOps Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb

      - name: Run DataOps Tests
        run: |
          pytest tests/dataops/ -v

  # ========================================================================
  # 4. DOCKER INTEGRATION
  # ========================================================================
  docker-integration:
    needs: [pre-docker-frontend, pre-docker-backend, pre-docker-dataops]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate .env.local from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> website/.env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_URL=http://localhost:3000" >> website/.env.local
          echo "BACKEND_URL=http://backend:8000" >> website/.env.local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: USERPROFILE=$HOME docker compose build

      - name: Start Database and Ollama Services
        run: USERPROFILE=$HOME docker compose up -d db ollama

      - name: Wait for Ollama and Pull Qwen Model Synchronously
        run: |
          echo "Waiting for Ollama service to boot..."
          until docker exec fsbm-ollama ollama list > /dev/null 2>&1; do
            sleep 3
          done
          echo "Ollama is online! Pulling qwen2.5:3b model..."
          docker exec fsbm-ollama ollama pull qwen2.5:3b
          echo "Model downloaded successfully."

      - name: Start Remaining Stack (Backend, Dagster, Frontend)
        run: USERPROFILE=$HOME docker compose up -d

      - name: Run DataOps Pipeline (Generate DuckDB)
        run: |
          echo "Waiting for Dagster to be ready..."
          sleep 10
          echo "Triggering data pipeline to build DuckDB..."
          # Replace 'your_pipeline_job_name' with the actual job name from your Dagster code
          docker exec fsbm-dagster dagster job execute -j your_pipeline_job_name

      - name: Verify Backend Health
        run: |
          echo "=== DUMPING LIVE BACKEND LOGS ==="
          # Read directly from the container to bypass compose buffering and warnings
          docker logs -f fsbm-backend &
          
          # Wait up to 15 minutes for the ready message
          COUNTER=0
          while ! docker logs fsbm-backend 2>&1 | grep -q "Chat engine successfully loaded and ready"; do
            sleep 10
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -gt 90 ]; then
              echo "ERROR: Backend initialization timed out after 15 minutes."
              echo "=== FULL CONTAINER LOGS FOR DEBUGGING ==="
              docker logs fsbm-backend
              exit 1
            fi
          done
          
          echo "Backend is ready! Checking health endpoint..."
          curl --fail http://localhost:8000/api/health || exit 1

      - name: Verify Frontend Health
        run: |
          curl --fail http://localhost:3000 || exit 1

      - name: Shut Down Stack
        if: always()
        run: USERPROFILE=$HOME docker compose down

  # ========================================================================
  # 5. POST-DOCKER TESTS
  # ========================================================================
  post-docker-tests:
    needs: docker-integration
    runs-on: ubuntu-latest
    steps:
      - name: Summary Check
        run: echo "All parallel pre-tests and docker integration checks passed successfully."