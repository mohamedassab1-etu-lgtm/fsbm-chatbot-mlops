name: FSBM Chatbot CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # 1. Pre-Docker Tests (e.g., Code linting, isolated unit tests)
  pre-docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Run Isolated Unit Tests (Placeholder)
        run: echo "Run tests that don't need databases here (e.g., pytest on tests/dataops/)"

  # 2. Docker Orchestration (Requires pre-docker-tests to pass)
  docker-integration:
    needs: pre-docker-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate .env.local from GitHub Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> website/.env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_URL=http://localhost:3000" >> website/.env.local
          echo "BACKEND_URL=http://backend:8000" >> website/.env.local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        # USERPROFILE=$HOME maps the Windows cache path to the Linux runner's home path
        run: USERPROFILE=$HOME docker compose build

      - name: Start Services
        run: USERPROFILE=$HOME docker compose up -d

      - name: Verify Backend Health
        run: |
          echo "Waiting for FastAPI to download models and initialize..."
          timeout 300 bash -c 'while ! docker compose logs backend | grep -q "Chat engine successfully loaded and ready"; do sleep 5; done'
          echo "Initialization log detected! Pinging health endpoint..."
          curl --fail http://localhost:8000/api/health || exit 1

      - name: Verify Frontend Health
        run: |
          curl --fail http://localhost:3000 || exit 1

      - name: Shut Down Stack
        if: always()
        run: USERPROFILE=$HOME docker compose down

  # 3. Post-Docker Tests (Requires docker-integration to pass)
  post-docker-tests:
    needs: docker-integration
    runs-on: ubuntu-latest
    steps:
      - name: Run E2E or Deployment Triggers (Placeholder)
        run: echo "Run tests that require the full stack here, or trigger deployment scripts."