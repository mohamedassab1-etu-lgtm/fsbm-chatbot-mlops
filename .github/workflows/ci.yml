name: FSBM Chatbot CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ========================================================================
  # 1. FRONTEND TESTS
  # ========================================================================
  pre-docker-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (Non-Blocking)
        continue-on-error: true
        run: npm run lint

      - name: Run Web Tests
        run: npm test -- --run

  # ========================================================================
  # 2. BACKEND API TESTS
  # ========================================================================
  pre-docker-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic langchain-ollama lingua-language-detector

      - name: Run LLM Unit Tests
        env:
          PYTHONPATH: ./llm-engine
        run: |
          pytest tests/llm/ -v

  # ========================================================================
  # 3. DATAOPS TESTS
  # ========================================================================
  pre-docker-dataops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install DataOps Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb

      - name: Run DataOps Tests
        run: |
          pytest tests/dataops/ -v

  # ========================================================================
  # 4. DOCKER INTEGRATION
  # ========================================================================
  docker-integration:
    needs: [pre-docker-frontend, pre-docker-backend, pre-docker-dataops]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate .env.local from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> website/.env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_URL=http://localhost:3000" >> website/.env.local
          echo "BACKEND_URL=http://backend:8000" >> website/.env.local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: USERPROFILE=$HOME docker compose build

      - name: Start Services
        run: USERPROFILE=$HOME docker compose up -d

      - name: Verify Backend Health
        run: |
          echo "Waiting for FastAPI to initialize..."
          timeout 300 bash -c 'while ! docker compose logs backend | grep -q "Chat engine successfully loaded and ready"; do sleep 5; done'
          curl --fail http://localhost:8000/api/health || exit 1

      - name: Verify Frontend Health
        run: |
          curl --fail http://localhost:3000 || exit 1

      - name: Shut Down Stack
        if: always()
        run: USERPROFILE=$HOME docker compose down

  # ========================================================================
  # 5. POST-DOCKER TESTS
  # ========================================================================
  post-docker-tests:
    needs: docker-integration
    runs-on: ubuntu-latest
    steps:
      - name: Summary Check
        run: echo "All parallel pre-tests and docker integration checks passed successfully."