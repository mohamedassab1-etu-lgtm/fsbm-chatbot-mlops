name: FSBM Chatbot CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  pre-docker-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Lint (Non-Blocking)
        continue-on-error: true
        run: npm run lint
      - name: Run Web Tests
        run: npm test -- --run

  pre-docker-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Backend Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic langchain-ollama lingua-language-detector prometheus-fastapi-instrumentator prometheus-client opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-logging
      - name: Run LLM Unit Tests
        env:
          PYTHONPATH: ./llm-engine
        run: pytest tests/llm/ -v

  pre-docker-dataops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install DataOps Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb
      - name: Run DataOps Tests
        run: pytest tests/dataops/ -v

  docker-integration:
    needs: [pre-docker-frontend, pre-docker-backend, pre-docker-dataops]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Allocate Swap Space to Prevent OOM
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Generate .env.local from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> website/.env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_URL=http://localhost:3000" >> website/.env.local
          echo "BACKEND_URL=http://backend:8000" >> website/.env.local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Start Database and Ollama Services
        run: docker compose up -d db ollama

      - name: Wait for Ollama and Pull Qwen Model Synchronously
        run: |
          echo "Waiting for Ollama service to boot..."
          until docker exec fsbm-ollama ollama list > /dev/null 2>&1; do
            sleep 3
          done
          echo "Ollama is online! Pulling qwen2.5:3b model..."
          docker exec fsbm-ollama ollama pull qwen2.5:3b
          echo "Model downloaded successfully."

      - name: Start Dagster Service
        run: docker compose up -d dagster

      - name: Run DataOps Pipeline (Generate DuckDB)
        run: |
          echo "Waiting for Dagster to be ready..."
          sleep 10
          echo "Creating empty directories for the database..."
          docker exec fsbm-dagster mkdir -p /app/data/duckdb
          echo "Triggering data pipeline to build DuckDB..."
          docker exec fsbm-dagster dagster asset materialize -f orchestration.py --select "*"

      - name: Start Full Stack (Backend, Frontend, Observability)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: docker compose up -d

      - name: Verify Backend Initialization
        run: |
          echo "=== DUMPING LIVE BACKEND LOGS ==="
          docker logs -f fsbm-backend &
          
          COUNTER=0
          while ! docker logs fsbm-backend 2>&1 | grep -q "Chat engine successfully loaded and ready"; do
            sleep 10
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -gt 90 ]; then
              echo "ERROR: Backend initialization timed out."
              docker logs fsbm-backend
              exit 1
            fi
          done
          echo "Backend is ready!"

      - name: Run Post-Docker E2E Integration Tests
        run: bash tests/e2e_integration.sh

      - name: Shut Down Stack
        if: always()
        run: docker compose down
  
  docker-push:
    needs: docker-integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./llm-engine
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./website
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-frontend:latest

      - name: Build and Push Dagster
        uses: docker/build-push-action@v5
        with:
          context: ./dataops
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-dagster:latest
  
  komodo-deploy:
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo Deployment Webhook
        run: |
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" --fail