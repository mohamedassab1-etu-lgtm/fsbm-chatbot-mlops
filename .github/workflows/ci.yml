name: FSBM Chatbot CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  # 0. LINTING (PYTHON CODE QUALITY)

  python-lint:
    name: Python Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Run Linter (Critical Errors Only)
        run: flake8 ./llm-engine ./dataops --count --select=E9,F63,F7,F82 --show-source --statistics
        
      - name: Run Linter (Style Warnings)
        continue-on-error: true
        run: flake8 ./llm-engine ./dataops --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 1. DATA UNIT TESTS -> SOURCES -> INGESTION DLT

  data-pipeline-ingestion:
    name: Data Ingestion & Unit Tests
    needs: [python-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Ingestion Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb dlt
          
      - name: Create Local DuckDB Directory
        working-directory: ./dataops
        run: mkdir -p data/duckdb
      
      - name: Run DataOps Unit Tests
        run: pytest tests/dataops/ -v

      - name: Hydrate DuckDB Database (Ingestion)
        working-directory: ./dataops
        run: |
          mkdir -p data/duckdb
          python ingest_dlt.py 

      - name: Upload DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database
          path: ./dataops/data/duckdb/fsbm.duckdb
          retention-days: 1

  # 2. DUCKDB -> DBT -> TESTS QUALITÉ

  data-quality-contracts:
    name: dbt Data Contracts & Quality
    needs: [data-pipeline-ingestion]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dbt Requirements
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb
          
      - name: Recreate Mock Docker Path
        run: |
          sudo mkdir -p /app/data/duckdb
          sudo chown -R $USER:$USER /app
          
      - name: Download DuckDB Artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database
          path: /app/data/duckdb/
        
      - name: Run dbt Data Contracts & Quality Tests
        working-directory: ./dataops/fsbm_transform
        run: |
          dbt deps
          dbt run
          dbt test

      - name: Upload Finalized DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-final-database
          path: /app/data/duckdb/fsbm.duckdb
          retention-days: 1

  # 3. LLM SERVICE VALIDATION (FASTAPI + LLM ENGINE)

  llm-service-validation:
    name: FastAPI & LLM Engine Tests
    needs: [python-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Backend Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic langchain-ollama lingua-language-detector prometheus-fastapi-instrumentator prometheus-client opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-logging duckdb langchain-chroma langchain-huggingface langchain_classic
      
      - name: Run LLM Unit Tests
        env:
          PYTHONPATH: ./llm-engine
          ENABLE_METRICS: "true"
        run: pytest tests/llm/ -v

  # 4 FRONTEND VALIDATION (NEXT.JS)

  frontend-validation:
    name: Next.js Frontend Tests
    needs: [python-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Lint (Non-Blocking)
        continue-on-error: true
        run: npm run lint
      - name: Run Web Tests
        run: npm test -- --run

  # 5. DATA ORCHESTRATION (DAGSTER)

  dagster-orchestration:
    name: Dagster Orchestration Execution
    needs: [data-quality-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dagster & DataOps Requirements
        run: |
          python -m pip install --upgrade pip
          pip install dlt dbt-core dbt-duckdb dagster dagster-dbt duckdb requests
          
      - name: Create Paths & Simulate Docker Mount
        working-directory: ./dataops
        run: |
          # 1. Create the local directory for dlt
          mkdir -p data/duckdb
          
          # 2. Simulate a Docker volume mount so dbt can find what dlt just wrote
          sudo mkdir -p /app/data
          sudo chown -R $USER:$USER /app
          ln -s ${{ github.workspace }}/dataops/data/duckdb /app/data/duckdb
          
      - name: Compile dbt Manifest
        working-directory: ./dataops/fsbm_transform
        run: |
          dbt deps
          dbt parse
          
      - name: Materialize Pipeline via Dagster
        working-directory: ./dataops
        env:
          DAGSTER_HOME: ${{ github.workspace }}/dagster_home
        run: |
          mkdir -p $DAGSTER_HOME
          dagster asset materialize -f orchestration.py --select "*"
          
      - name: Upload Orchestrated DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: ./dataops/data/duckdb/fsbm.duckdb
          retention-days: 1

  # 6. CONTENEURISATION (DOCKER INTEGRATION)

  docker-integration:
    name: Docker Full Stack Integration
    needs: [dagster-orchestration, llm-service-validation, frontend-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Orchestrated DuckDB Artifact
        uses: actions/download-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: ./dataops/data/duckdb/

      - name: Allocate Swap Space to Prevent OOM
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Generate .env.local and .env from Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> website/.env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> website/.env.local
          echo "NEXTAUTH_URL=http://localhost:3000" >> website/.env.local
          echo "BACKEND_URL=http://backend:8000" >> website/.env.local
          echo "DATABASE_URL=mysql://root:root@localhost:3306/fsbm_assistant" >> website/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Start Database and Ollama Services
        run: docker compose up -d db ollama

      - name: Wait for Ollama and Pull Qwen Model Synchronously
        run: |
          echo "Waiting for Ollama service to boot..."
          until docker exec fsbm-ollama ollama list > /dev/null 2>&1; do
            sleep 3
          done
          echo "Ollama is online! Pulling qwen2.5:3b model..."
          docker exec fsbm-ollama ollama pull qwen2.5:3b
          echo "Model downloaded successfully."

      - name: Start Full Stack (Backend, Frontend, Dagster, Observability)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: docker compose up -d

      - name: Verify Backend Initialization
        run: |
          echo "=== DUMPING LIVE BACKEND LOGS ==="
          docker logs -f fsbm-backend &
          
          COUNTER=0
          while ! docker logs fsbm-backend 2>&1 | grep -q "Chat engine successfully loaded and ready"; do
            sleep 10
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -gt 90 ]; then
              echo "ERROR: Backend initialization timed out."
              docker logs fsbm-backend
              exit 1
            fi
          done
          echo "Backend is ready!"

      - name: Set up Python for Integration Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Integration Dependencies
        run: pip install pytest httpx

      - name: Run Python Post-Docker Integration Tests
        run: pytest tests/integration/ -v

      - name: Run Post-Docker E2E Integration Tests
        run: bash tests/e2e_integration.sh

      - name: Shut Down Stack
        if: always()
        run: docker compose down
  
  # 7. CI/CD -> DEPLOYMENT & OBSERVABILITY

  docker-push:
    name: Push Images to DockerHub
    needs: docker-integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./llm-engine
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./website
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-frontend:latest

      - name: Build and Push Dagster
        uses: docker/build-push-action@v5
        with:
          context: ./dataops
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fsbm-dagster:latest
  
  # 8. DEPLOYMENT (KOMODO)

  komodo-deploy:
    name: Automated Deployment (Komodo)
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo via Official SDK
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          npm install komodo_client
          cat << 'EOF' > deploy.mjs
          global.localStorage = { getItem: () => null, setItem: () => {} };
          const { KomodoClient } = await import("komodo_client");
          async function run() {
            const komodo = KomodoClient("https://komodo.s3.fsbm.ma", {
              type: "api-key",
              params: { key: process.env.KOMODO_API_KEY, secret: process.env.KOMODO_API_SECRET }
            });
            await komodo.execute("DeployStack", { stack: "assistant_conversationnel_universitaire" });
          }
          run().catch(err => { console.error(err); process.exit(1); });
          EOF
          node deploy.mjs