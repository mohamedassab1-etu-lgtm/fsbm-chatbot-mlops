name: 01 - Code Quality & Security CI

on:
  push:
    branches: [ 'main', 'team-devops/*', 'team-data', 'team-agile' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black bandit

      - name: Check Code Formatting (Black)
        run: black --check . --exclude "/(\.git|\.venv|env)/"

      - name: Lint Code (Ruff)
        run: ruff check .

      - name: Security Audit (Bandit)
        run: bandit -r web-backend/ llm-engine/ dataops/ -ll --skip B101
