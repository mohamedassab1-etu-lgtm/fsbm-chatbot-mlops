version: 2

models:
  - name: stg_emplois
    description: "Table des emplois du temps structurés par section."
    tests:
      - dbt_expectations.expect_table_columns_to_match_set:
          column_list: ["section", "planning_json"]
    columns:
      - name: section
        description: "Nom de la section ou du groupe d'étudiants (ex: Tronc Commun PC1)."
        tests:
          - not_null
          - unique
      - name: planning_json
        description: "Planning complet de la semaine au format JSON structuré."